<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird | Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #52c1cf; /* Classic Flappy Sky Blue */
            --accent: #f7d10e;  /* Bird Yellow */
            --pipe-green: #73bf2e;
            --glass: rgba(255, 255, 255, 0.15);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, var(--primary) 0%, #2b8a96 100%);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            overflow-x: hidden;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 2.5rem;
            margin-top: 50px;
            text-shadow: 4px 4px 0px #000;
            color: var(--accent);
            letter-spacing: 2px;
        }

        .subtitle {
            margin-bottom: 40px;
            font-weight: 300;
            opacity: 0.9;
        }

        .card-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            width: 320px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        /* Image Wrapper for zoom effect */
        .img-wrapper {
            width: 100%;
            height: 200px;
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover img {
            transform: scale(1.1);
        }

        .card-body {
            padding: 25px;
            background: rgba(0, 0, 0, 0.2);
        }

        .btn {
            display: block;
            text-decoration: none;
            background: var(--pipe-green);
            color: white;
            padding: 12px 0;
            border-radius: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 0px #4a801b;
            transition: all 0.1s active;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .btn:hover {
            filter: brightness(1.1);
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px #4a801b;
        }

        /* Floating Animation for the Bird Vibes */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        .card:nth-child(even) { animation: float 4s ease-in-out infinite; }
        .card:nth-child(odd) { animation: float 4s ease-in-out infinite 1s; }

        @media (max-width: 768px) {
            h1 { font-size: 1.5rem; }
            .card-container { flex-direction: column; }
        }
    </style>
</head>
<body>

    <h1>FLAPPY BIRD</h1>
    <p class="subtitle">Experience the ultimate arcade challenge</p>

    <div class="card-container">
        <!-- Card 1 -->
        <div class="card">
            <a href="ktkd.html" class="img-wrapper">
                <img src="assets/gameover.jpg" alt="Classic Mode">
            </a>
            <div class="card-body">
                <a href="ktkd.html" class="btn">Start Classic</a>
            </div>
        </div>

        <!-- Card 2 -->
        <div class="card">
            <a href="jomu.html" class="img-wrapper">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcReznhoqBhFi4Qrd2KV_QgnaLOyNntMD0Rn3g&s" alt="Special Edition">
            </a>
            <div class="card-body">
                <a href="jomu.html" class="btn">Play Special</a>
            </div>
        </div>
    </div>

</body>
</html>
